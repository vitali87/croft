# Single source of truth for the Rust toolchain across every machine.
#
# `cargo`/`rustup` resolve to this exact version on every machine, so the macOS
# and Linux boxes compile with byte-identical toolchains — the thing whose
# absence let croft go un-built on Linux for a while. Bump deliberately.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-src", "rust-analyzer"]
