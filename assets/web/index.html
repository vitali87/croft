<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>croft</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  #screen { position: absolute; inset: 0; }
  canvas { position: absolute; left: 0; top: 0; }
  #images img { position: absolute; image-rendering: auto; pointer-events: none; }
  #banner { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px;
    font: 13px system-ui, sans-serif; color: #eee; background: #7a2e2e; display: none; }
  #input { position: absolute; left: -1000px; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="screen"><canvas id="c"></canvas><div id="images"></div></div>
<textarea id="input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
<div id="banner"></div>
<script type="module">
import { Term, ATTR, encodeKey } from "./term.js";

const FONT_SIZE = 14;
const FONT = `${FONT_SIZE}px "croft icons", "MesloLGS Nerd Font Mono", "MesloLGS NF", Menlo, monospace`;
const DEFAULT_FG = "#d4d4d4";
const DEFAULT_BG = "#1e1e1e";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const imagesEl = document.getElementById("images");
const input = document.getElementById("input");
const banner = document.getElementById("banner");

function say(text) { banner.textContent = text; banner.style.display = text ? "block" : "none"; }

// Cell metrics from the font.
ctx.font = FONT;
const cw = Math.ceil(ctx.measureText("M").width);
const ch = Math.ceil(FONT_SIZE * 1.25);
const dpr = window.devicePixelRatio || 1;

function gridSize() {
  return {
    cols: Math.max(20, Math.floor(window.innerWidth / cw)),
    rows: Math.max(5, Math.floor(window.innerHeight / ch)),
  };
}

let { cols, rows } = gridSize();
const term = new Term(cols, rows);

function sizeCanvas() {
  canvas.width = cols * cw * dpr;
  canvas.height = rows * ch * dpr;
  canvas.style.width = `${cols * cw}px`;
  canvas.style.height = `${rows * ch}px`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textBaseline = "top";
}
sizeCanvas();

const css = (rgb, fallback) => (rgb ? `rgb(${rgb[0]},${rgb[1]},${rgb[2]})` : fallback);

function drawRow(y) {
  const row = term.grid[y];
  for (let x = 0; x < cols; x++) {
    const cell = row[x];
    let fg = css(cell.fg, DEFAULT_FG);
    let bg = css(cell.bg, DEFAULT_BG);
    if (cell.attrs & ATTR.INVERSE) [fg, bg] = [bg, fg];
    const w = cell.w === 2 ? 2 : 1;
    ctx.fillStyle = bg;
    ctx.fillRect(x * cw, y * ch, cw * w, ch);
    if (cell.w === 0 || cell.ch === " ") continue;
    ctx.font = `${cell.attrs & ATTR.ITALIC ? "italic " : ""}${cell.attrs & ATTR.BOLD ? "bold " : ""}${FONT}`;
    ctx.fillStyle = fg;
    ctx.globalAlpha = cell.attrs & ATTR.DIM ? 0.6 : 1;
    ctx.fillText(cell.ch, x * cw, y * ch + 1);
    ctx.globalAlpha = 1;
    if (cell.attrs & ATTR.UNDERLINE) ctx.fillRect(x * cw, y * ch + ch - 2, cw * w, 1);
    if (cell.attrs & ATTR.STRIKE) ctx.fillRect(x * cw, y * ch + ch / 2, cw * w, 1);
  }
}

function drawCursor() {
  if (!term.cursorVisible || document.activeElement !== input) return;
  const x = Math.min(term.cx, cols - 1);
  ctx.fillStyle = "rgba(220,220,220,0.7)";
  ctx.fillRect(x * cw, term.cy * ch, cw, ch);
}

let lastCursor = null;
const placed = new Map();

function syncImages() {
  const want = new Map(term.images.map((im) => [`${im.x},${im.y},${im.data.length}`, im]));
  for (const [key, el] of placed) if (!want.has(key)) { el.remove(); placed.delete(key); }
  for (const [key, im] of want) {
    if (placed.has(key) || im.format !== "100") continue;
    const el = document.createElement("img");
    el.src = `data:image/png;base64,${im.data}`;
    el.style.left = `${im.x * cw}px`;
    el.style.top = `${im.y * ch}px`;
    el.style.width = `${im.cols * cw}px`;
    el.style.height = `${im.rows * ch}px`;
    imagesEl.appendChild(el);
    placed.set(key, el);
  }
}

let scheduled = false;
function frame() {
  scheduled = false;
  if (lastCursor !== null) term.dirty.add(lastCursor);
  for (const y of term.dirty) if (y < rows) drawRow(y);
  term.dirty.clear();
  drawCursor();
  lastCursor = term.cursorVisible ? term.cy : null;
  syncImages();
}
function schedule() { if (!scheduled) { scheduled = true; requestAnimationFrame(frame); } }

// The session.
const params = new URLSearchParams(location.search);
const ws = new WebSocket(`ws://${location.host}/?token=${encodeURIComponent(params.get("token") || "")}`);
ws.binaryType = "arraybuffer";
const send = (text) => { if (ws.readyState === 1) ws.send(new TextEncoder().encode(text)); };
const control = (obj) => { if (ws.readyState === 1) ws.send(JSON.stringify(obj)); };

ws.onopen = () => {
  say("");
  control({ t: "hello", name: `browser ${navigator.platform || ""}`.trim(), cols, rows });
  input.focus();
};
ws.onclose = () => say("The session connection closed. Reload to reconnect.");
ws.onmessage = (ev) => {
  if (typeof ev.data === "string") {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.t === "presence" && Array.isArray(msg.participants)) {
      document.title = `croft · ${msg.participants.length} attached`;
    }
    if (msg.t === "exit") say("The session ended.");
    return;
  }
  term.write(new Uint8Array(ev.data));
  for (const r of term.takeReplies()) send(r);
  if (term.title) document.title = term.title;
  schedule();
};

input.addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  const seq = encodeKey(e);
  if (seq !== null) { e.preventDefault(); send(seq); }
});
input.addEventListener("input", () => { if (input.value) { send(input.value); input.value = ""; } });
input.addEventListener("paste", (e) => {
  e.preventDefault();
  const text = e.clipboardData.getData("text/plain");
  send(term.modes.has(2004) ? `\x1b[200~${text}\x1b[201~` : text);
});

// Mouse, as SGR reports whenever croft has asked for them.
function cell(e) {
  const r = canvas.getBoundingClientRect();
  return [Math.max(1, Math.min(cols, Math.floor((e.clientX - r.left) / cw) + 1)),
          Math.max(1, Math.min(rows, Math.floor((e.clientY - r.top) / ch) + 1))];
}
const mouseOn = () => term.modes.has(1000) || term.modes.has(1002) || term.modes.has(1003);
function mods(e) { return (e.shiftKey ? 4 : 0) + (e.altKey ? 8 : 0) + (e.ctrlKey ? 16 : 0); }
let held = -1;
canvas.addEventListener("mousedown", (e) => {
  input.focus();
  if (!mouseOn()) return;
  held = e.button;
  const [x, y] = cell(e);
  send(`\x1b[<${e.button + mods(e)};${x};${y}M`);
  e.preventDefault();
});
window.addEventListener("mouseup", (e) => {
  if (!mouseOn() || held < 0) return;
  const [x, y] = cell(e);
  send(`\x1b[<${held + mods(e)};${x};${y}m`);
  held = -1;
});
canvas.addEventListener("mousemove", (e) => {
  if (!(term.modes.has(1002) && held >= 0) && !term.modes.has(1003)) return;
  const [x, y] = cell(e);
  send(`\x1b[<${(held >= 0 ? held : 3) + 32 + mods(e)};${x};${y}M`);
});
canvas.addEventListener("wheel", (e) => {
  if (!mouseOn()) return;
  e.preventDefault();
  const [x, y] = cell(e);
  send(`\x1b[<${(e.deltaY < 0 ? 64 : 65) + mods(e)};${x};${y}M`);
}, { passive: false });

// Resize: tell the host the page's grid; its smallest-window rule applies.
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    ({ cols, rows } = gridSize());
    term.resize(cols, rows);
    sizeCanvas();
    control({ t: "resize", cols, rows });
    schedule();
  }, 100);
});

schedule();
</script>
</body>
</html>
