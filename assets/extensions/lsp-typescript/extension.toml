# Bundled croft extension: TypeScript / JavaScript language support.
# One server (vtsls) serves all four TS/JS language ids. croft owns an
# npm-installed copy pinned for local/remote parity; a global vtsls is the
# fallback (see src/lsp/install.rs).
id = "lsp-typescript"
name = "TypeScript / JavaScript (vtsls)"
description = "TypeScript and JavaScript language support via vtsls."
builtin = true
api_version = 1

# All four TS/JS languages share vtsls and the same project markers. The three
# non-canonical ids declare `family = "typescript"` so a managed-install re-open
# treats the whole family as one server (matches the old `lsp_server_family`).
[[languages]]
id = "typescript"
extensions = ["ts"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]

[[languages]]
id = "typescriptreact"
extensions = ["tsx"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
family = "typescript"

[[languages]]
id = "javascript"
extensions = ["js", "mjs", "cjs"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
family = "typescript"

[[languages]]
id = "javascriptreact"
extensions = ["jsx"]
root_markers = ["tsconfig.json", "jsconfig.json", "package.json"]
family = "typescript"

[[language_servers]]
name = "vtsls"
command = "vtsls"
args = ["--stdio"]
languages = ["typescript", "typescriptreact", "javascript", "javascriptreact"]
priority = 0
provision = { kind = "npm", package = "@vtsls/language-server", version = "0.3.0", bin = "vtsls" }
