# Catalog entry: CodeQL (#1842). Available to add from the Extensions panel;
# not installed until the user adds it. On add, this manifest is written into
# ~/.config/croft/extensions/codeql/ and the CodeQL side bar, its activity-bar
# icon and its "CodeQL:" commands appear. The language server is the CodeQL
# CLI's own (`codeql execute language-server`), expected on the user's PATH
# alongside the rest of the CLI; it starts on the next launch, as any added
# language server does.
id = "codeql"
name = "CodeQL"
description = "CodeQL databases, queries, query history, the AST viewer and the QL language server."
builtin = false
api_version = 1

[[languages]]
id = "ql"
extensions = ["ql", "qll"]
root_markers = ["qlpack.yml", "codeql-pack.yml"]

[[language_servers]]
name = "codeql"
command = "codeql"
args = ["execute", "language-server", "--check-errors", "ON_CHANGE"]
language = "ql"
priority = 0
