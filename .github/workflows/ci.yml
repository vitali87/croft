name: CI

# The gates that used to exist only as habit on one Mac.
#
# The cross-build jobs are the point. `croft <host>` cross-compiles a static
# binary locally and ships it; when the pinned toolchain lacks a target, that
# path silently degrades to a full `cargo install` on the user's box, with
# nothing but a line in ~/.cache/croft/install.log to say so. Rustup targets
# belong to ONE toolchain, so bumping rust-toolchain.toml orphans every one of
# them - which is what the 1.95.0 -> 1.97.1 bump did, unnoticed for four days.
#
# These jobs run the REAL build (zig for musl, the NDK for Android), not
# `cargo check`: croft's tree-sitter grammars are C, so their build scripts
# need a working cross C compiler and a check alone fails before it can prove
# anything useful.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-hygiene:
    # Every merge that changes what ships must be a release in its own right
    # (#281): the version increments (two different binaries must never share
    # a version and differ only in commit hash), and src/release_notes.rs is
    # replaced so the welcome panel's "IN THIS RELEASE" card describes THIS
    # version instead of silently carrying the previous release's story.
    # Docs / CI / test-only changes ship nothing and are exempt.
    name: version bump + release notes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the PR base resolves.
          fetch-depth: 0
      - name: Shipped changes must bump the version and replace the notes
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          changed="$(git diff --name-only "$base" HEAD)"
          # What ships in the binary: sources, baked-in assets, the build
          # script, and the dependency set. src/app/tests.rs and tests/ are
          # compiled out of release builds.
          shipped="$(printf '%s\n' "$changed" \
            | grep -E '^(src/|assets/|build\.rs$|Cargo\.toml$|Cargo\.lock$)' \
            | grep -vE '^(src/app/tests\.rs|tests/)' || true)"
          if [ -z "$shipped" ]; then
            echo "No shipped files changed; no release required."
            exit 0
          fi
          echo "Shipped files changed:"
          printf '  %s\n' $shipped
          ver() { git show "$1:Cargo.toml" | sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' | head -n1; }
          old="$(ver "$base")"
          new="$(ver HEAD)"
          fail=0
          highest="$(printf '%s\n%s\n' "$old" "$new" | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)"
          if [ "$new" = "$old" ] || [ "$highest" != "$new" ]; then
            echo "::error file=Cargo.toml::This PR changes shipped files but the version is still $old. Bump it (base: $old, head: $new) - two binaries must never share a version and differ only in commit hash."
            fail=1
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'src/release_notes.rs'; then
            echo '::error file=src/release_notes.rs::This PR changes shipped files but src/release_notes.rs is untouched. REPLACE the "IN THIS RELEASE" highlights so the welcome panel describes this version.'
            fail=1
          fi
          exit $fail

  doc-ownership:
    # Rust attaches a `///` block to whatever item FOLLOWS it, so inserting a
    # function between an existing one and its doc silently hands that prose to
    # the newcomer (#314). Nothing else here reports it: the build stays green,
    # clippy is silent, and the rendered rustdoc is confidently WRONG rather
    # than absent - which stops a reader looking, where absent docs would have
    # sent them to the code. It has happened twice on one branch, and a sweep
    # of recent history found four more that had shipped.
    #
    # The snapshot is undetectable (well-formed prose above a plausible
    # function) but the diff is not: a function that had a doc and now has none
    # is the exact fingerprint. Validated against both known instances.
    name: doc comments stay with their function
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the PR base resolves.
          fetch-depth: 0
      - name: No function may lose its doc comment
        run: |
          set -euo pipefail
          base="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)"
          python3 scripts/check_doc_ownership.py "$base" HEAD

  test:
    name: clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The suite's terminal tests drive /bin/zsh (the shim they exist to
      # cover) and the PDF tests rasterise through poppler's pdftoppm - the
      # same binaries croft needs at runtime on a Linux box. The runner
      # ships neither.
      - name: Install suite runtime dependencies
        # The chmod keeps compinit's "insecure directories" interactive
        # prompt from wedging every spawned zsh before its first prompt
        # (croft never calls compinit; the runner's own zsh startup does).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh poppler-utils
          for d in /usr/share/zsh /usr/local/share/zsh; do
            if [ -d "$d" ]; then sudo chmod -R go-w "$d"; fi
          done
      # rust-toolchain.toml is the single source of truth; `rustup show`
      # installs exactly the pinned channel and its components.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Formatting (pinned rustfmt, zero diffs)
        run: cargo fmt --check
      - name: Clippy (zero warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # The suite spawns PTYs and real shells; keep the thread count modest
        # so the timing-sensitive terminal tests are not starved.
        run: cargo test --locked
        env:
          RUST_TEST_THREADS: 4

  cross-musl:
    name: ship-path build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # CROSS_TARGETS in src/cli.rs: the triples `croft <host>` ships.
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Add the target to the PINNED toolchain
        # Run from the checkout so rust-toolchain.toml resolves the channel.
        # Adding to the default toolchain instead is precisely the bug this
        # job exists to catch.
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        # cargo-zigbuild probes `python3 -m ziglang` before looking for a zig
        # binary on PATH. Recent runner images mark the system Python as
        # externally managed, so pip needs the override.
        run: |
          python3 -m pip install --break-system-packages ziglang \
            || python3 -m pip install ziglang
          python3 -m ziglang version
          cargo install cargo-zigbuild --locked
      # Byte-for-byte the command src/remote.rs runs for a remote install.
      - name: cargo zigbuild --profile remote-fast
        run: cargo zigbuild --profile remote-fast --locked --bin croft --target ${{ matrix.target }}
      - name: The shipped artifact must exist and be a Linux ELF
        run: |
          bin="target/${{ matrix.target }}/remote-fast/croft"
          test -x "$bin"
          file "$bin"
          file "$bin" | grep -q 'ELF 64-bit LSB'

  android:
    name: Android build (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show
      - name: Add the Android target to the PINNED toolchain
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # Termux builds croft natively on the phone, so nothing ships this
      # artifact. Compiling it here is what catches code that cannot build on
      # Android at all - otherwise the only way to find out is on the device,
      # by hand, after the fact. cargo-ndk wires the runner's NDK into the C
      # build scripts the tree-sitter grammars need.
      - name: cargo ndk build
        # ANDROID_NDK_LATEST_HOME is exported by the runner image into the
        # process environment, which the `env` context does NOT see - so it
        # has to be expanded by the shell, not by an expression.
        # --platform 24: bionic only exports openpty/forkpty from API 23,
        # and cargo-ndk's default level is older, so the link dies on
        # `undefined symbol: openpty`. 24 is what Termux itself targets.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "Using NDK at $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME"
          cargo ndk --target arm64-v8a --platform 24 build --locked --bin croft
