# Release every PUBLISH_EVERY version bumps: GitHub first, then crates.io.
#
# croft bumps its version on every shipped merge, which is far more often
# than anyone needs a release. This mirrors code-graph-rag's cadence: on
# each push to main, count the versions main has carried since the newest
# one crates.io already holds (scripts/publish_cadence.py, anchored on the
# crates.io index rather than on a counter kept in the repo), and when the
# count reaches PUBLISH_EVERY, tag the commit that set that version, hand the
# tag to release.yml for the prebuilt archives, the GitHub release and the
# Homebrew formula, wait for that release, and only then publish the version
# to crates.io from the same commit.
#
# crates.io goes last because `cargo binstall croft-software` asks crates.io
# for the newest version and then downloads that version's archive from its
# GitHub release. While crates.io went first, every release left a window in
# which binstall resolved a version whose archives were still being built:
# twenty minutes for 0.2.82, ninety-seven for 0.2.32. `cargo publish
# --dry-run` still runs before the tag, so a crate that does not package or
# build stops the release before anything is public.
#
# A merge that should not wait for the count gets the `release now` label on
# its pull request, as in code-graph-rag: the first version that includes it
# publishes as soon as it is cut (scripts/release_now.py). It counts only
# when whoever applied it last is a repository admin or maintainer.
#
# This is the only workflow that starts a release. tag.yml tags every
# version but releases none, so crates.io and the GitHub releases hold the
# same versions (#1579).
#
# Authentication is crates.io Trusted Publishing: the job exchanges its OIDC
# token for a short-lived crates.io token scoped to this crate, so there is
# no long-lived CARGO_REGISTRY_TOKEN to store or rotate. It needs a one-time
# configuration on crates.io (crate settings -> Trusted Publishing): owner
# vitali87, repository croft, workflow publish-crate.yml, environment
# crates-io.
#
# The tag is pushed with the workflow's own token, and a push made with that
# token never triggers another workflow, so release.yml is dispatched by name
# on the tag ref instead. It runs there with github.ref = refs/tags/v<version>,
# which is what its publish job and its cosign identity key on.
name: publish crate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Publish main's head now, regardless of the cadence"
        type: boolean
        default: false

# Read at the top level; the publish job alone takes what it needs.
permissions:
  contents: read

env:
  PUBLISH_EVERY: 50
  CARGO_TERM_COLOR: always

# Two merges in quick succession queue rather than cancel: a publish that is
# half way through uploading must finish before the next decision is made.
concurrency:
  group: publish-crate
  cancel-in-progress: false

jobs:
  decide:
    name: count bumps since the last publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Which merged pull requests carry the `release now` label, their merge
      # commits, and who applied it (scripts/release_now.py).
      issues: read
      pull-requests: read
    outputs:
      # The label only brings a release forward: it never holds one back.
      publish: ${{ steps.cadence.outputs.publish == 'true' || steps.label.outputs.release_now == 'true' }}
      version: ${{ steps.cadence.outputs.version }}
      already_published: ${{ steps.cadence.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the count walks main's first-parent chain back to
          # the newest published version, which can be hundreds of merges.
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a ref other than main
        # A push run is main by the trigger; a manual dispatch can name any
        # branch, and a forced run there would publish that branch's code.
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish-crate publishes main only, not $GITHUB_REF"
          exit 1

      - name: Decide
        id: cadence
        env:
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml | head -n1)"
          flags=()
          [ "$FORCE" = "true" ] && flags+=(--force)
          # A head already on crates.io with no GitHub release is an upload
          # whose handoff never ran; the script makes that due on its own.
          # The release is the evidence, not the tag: tag.yml tags every
          # version. 404 is "no such release"; anything else is a failure.
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$head")"
          case "$code" in
            200) flags+=(--released) ;;
            404) ;;
            *) echo "::error::asking for the v$head release answered HTTP $code"; exit 1 ;;
          esac
          # The script prints nothing on a refusal, so a partial answer never
          # reaches GITHUB_OUTPUT; `set -e` then fails the job on its exit 2.
          python3 scripts/publish_cadence.py --every "$PUBLISH_EVERY" \
            --head "$head" --from-git --fetch "${flags[@]}" | tee -a "$GITHUB_OUTPUT"

      - name: Release now if a maintainer labelled a merge in this version
        # Asked only when the count says wait, so most pushes make no call. A
        # failed lookup fails the run rather than reading as "nobody asked".
        # The next push asks again; removing the label ends a lookup that
        # keeps failing.
        id: label
        if: steps.cadence.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.cadence.outputs.latest_published }}
        run: |
          set -euo pipefail
          python3 scripts/release_now.py "$LATEST" | tee -a "$GITHUB_OUTPUT"

  publish:
    name: publish ${{ needs.decide.outputs.version }}
    needs: decide
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Most of it is waiting for release.yml: its four builds take about
    # twenty minutes, and its publish job has waited over an hour for a
    # runner before.
    timeout-minutes: 180
    environment: crates-io
    permissions:
      # The OIDC token crates.io exchanges for a publish token.
      id-token: write
      # Pushing the tag.
      contents: write
      # Dispatching release.yml on that tag and following its run.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after the fetch; leaving it
          # in .git/config lets any later step push with it.
          persist-credentials: false
          # Full history: the commit that set the version is found by
          # walking back to it.
          fetch-depth: 0

      - name: Check out the commit that set this version
        # Not this run's commit. That can be a merge that landed after the
        # version was cut and before the next one (a forced run, or the run
        # that replaced the release commit's own), and its code is not this
        # version yet. `release.py commit` walks main's first-parent chain
        # back to the commit whose first parent carries another version, and
        # tag.yml tags a push only when its commit is that one, by the same
        # comparison, so crates.io, the tag and the binaries release.yml
        # builds from it are one source. It refuses a malformed version and
        # a head that does not carry this one.
        id: source
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          commit="$(python3 scripts/release.py commit "$VERSION")"
          git checkout -q --detach "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION from $commit"

      - name: Install the pinned toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: publish-crate

      - name: Check crates.io for this version
        # Asked again here rather than taken from decide: re-running only this
        # job after an upload that succeeded (cargo's index wait can time out
        # after the upload lands) reuses decide's stale answer.
        id: index
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import publish_cadence as pc
          uploaded = os.environ["VERSION"] in pc.parse_index(pc.fetch_index(pc.CRATE))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"uploaded={str(uploaded).lower()}\n")
          PY

      - name: Check the crate packages and builds
        # Before the tag and the release, so a crate that cannot go to
        # crates.io stops everything while nothing is public yet. The upload
        # at the end then skips this verify: it ships this same checkout.
        if: steps.index.outputs.uploaded != 'true'
        # --locked: the lockfile is what CI tested, so it is what ships.
        run: cargo publish --locked --dry-run

      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          commit="$COMMIT"
          # An existing tag is reused only if it names the commit this job
          # publishes: release.yml builds whatever the tag points at. tag.yml
          # has normally tagged it already. An annotated tag's `^{}` line is
          # the commit it peels to.
          target="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" \
            | awk -v t="refs/tags/$tag" '$2 == t "^{}" { p = $1 } $2 == t { d = $1 } END { print (p != "" ? p : d) }')"
          if [ -n "$target" ]; then
            if [ "$target" != "$commit" ]; then
              echo "::error::$tag already points at $target, not at $commit, the commit published"
              exit 1
            fi
            echo "$tag already exists at $commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "croft $VERSION" "$commit"
            # gh's credential helper, not a token in the remote URL, so the
            # token never lands in .git/config or the log.
            gh auth setup-git
            git push origin "refs/tags/$tag"
          fi

      - name: Release on GitHub and wait for it
        # Dispatches release.yml on the tag and returns once its GitHub
        # release is published, which is when the archives binstall downloads
        # exist. A re-run that finds the release already out dispatches
        # nothing. A run that ends without the release fails this job, so
        # crates.io never gets a version GitHub does not have.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # 404 until the release is published. `gh release create` uploads
          # the archives to a draft and publishes it after, and a draft is
          # not served by tag, so a 200 means the archives are up.
          release() {
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          }
          code="$(release)"
          case "$code" in
            200) echo "$tag is already released"; exit 0 ;;
            404) ;;
            *) echo "::error::asking for the $tag release answered HTTP $code"; exit 1 ;;
          esac
          # The dispatch does not name the run it starts, so the run is the
          # newest dispatched one on the tag that was not there before.
          newest() {
            gh run list --workflow release.yml --event workflow_dispatch --branch "$tag" \
              --limit 1 --json databaseId --jq '.[0].databaseId // ""'
          }
          before="$(newest)"
          gh workflow run release.yml --ref "$tag"
          run=""
          for _ in $(seq 30); do
            sleep 10
            # A failed lookup is asked again, not taken for the run.
            run="$(newest || true)"
            if [ -n "$run" ] && [ "$run" != "$before" ]; then
              break
            fi
            run=""
          done
          if [ -z "$run" ]; then
            echo "::error::the release.yml run dispatched on $tag never appeared"
            exit 1
          fi
          echo "Waiting for release.yml run $run to publish $tag"
          # Not for the whole run: the Homebrew job after the release has no
          # bearing on crates.io, and a failure there must not hold it back.
          until [ "$(release)" = 200 ]; do
            if [ "$(gh run view "$run" --json status --jq .status)" = completed ]; then
              # Its publish job can land the release just before the run ends.
              if [ "$(release)" = 200 ]; then
                break
              fi
              echo "::error::release.yml run $run ended without publishing $tag, so $VERSION does not go to crates.io"
              exit 1
            fi
            sleep 30
          done
          echo "- released **${VERSION}** on GitHub as \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Mint a crates.io token
        # Skipped when the version is already on crates.io: a re-run after an
        # upload that landed has nothing to upload.
        if: steps.index.outputs.uploaded != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        if: steps.index.outputs.uploaded != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        # --no-verify: the dry run above built this same checkout.
        run: |
          cargo publish --locked --no-verify
          echo "- published **${VERSION}** to crates.io" >> "$GITHUB_STEP_SUMMARY"
