name: tag

# Every merge to main gets a tag (#1091).
#
# version-bump.yml folds every merge's pending release notes into a
# `chore: release <version>` commit on main, so the version at that commit
# names the binary it ships. This job turns it into `v<version>` on that
# commit, and that is all it does.
#
# It does not start release.yml. publish-crate.yml decides which versions are
# released (every PUBLISH_EVERY bumps, as code-graph-rag does) and sends each
# one to crates.io and to release.yml together, so crates.io and the GitHub
# releases hold the same versions (#1579). When this job started release.yml
# too, every version got a GitHub release and only every fiftieth reached
# crates.io.
#
# Any other push to main (the merge itself, or one that ships nothing) still
# carries the previous version, and that version's tag already exists on the
# commit that introduced it. Moving it would change what a published release
# points at, so such a push is reported and left alone.

on:
  push:
    branches: [main]

# Two merges in quick succession must not race to read "no tag yet" for the
# same version. Queued, not cancelled: a cancelled run is a merge left untagged.
# By default a group keeps one pending run and a newer one replaces it (tag
# runs were cancelled that way), so every queued run waits its turn instead.
concurrency:
  group: tag-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  tag:
    name: tag the merged version
    runs-on: ubuntu-latest
    permissions:
      # Read Cargo.toml at the merge commit and create the tag ref. A tag
      # created with github.token fires no `push: tags` workflow, so this
      # starts no release.
      contents: write
    # No checkout and no action: with this token, the job runs only the
    # runner's own `gh`, every REST call pinned to an API version, so nothing
    # it executes can change without a diff here. scripts/check_tag_workflow.py
    # holds it to that.
    steps:
      - name: Create v<version> on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { gh api -H "X-GitHub-Api-Version: 2026-03-10" "$@"; }
          version="$(api -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$GITHUB_SHA" \
            | sed -n 's/^version *= *"\([0-9.]*\)".*/\1/p' | head -n1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::could not read the package version"
            exit 1
          fi
          tag="v$version"
          if existing="$(api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            echo "::notice::$tag already exists ($existing); this merge did not bump the version, so there is no new release to tag."
            exit 0
          fi
          api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          echo "Tagged $GITHUB_SHA as $tag"
