[project]
name = "terminal-vscode"
version = "0.1.0"
description = "VS Code-style three-pane TUI: file tree, editor, embedded terminal"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pyperclip>=1.11.0",
    "pyte>=0.8.2",
    "rich>=14.2,<15",
    "textual[syntax]>=8.2.5",
    "typer>=0.25.1",
]

[project.scripts]
tcode = "terminal_vscode.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_vscode"]
