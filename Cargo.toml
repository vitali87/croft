[package]
name = "croft"
version = "0.1.495"
edition = "2024"
description = "VSCode-style TUI written in Rust"
license = "MIT"
repository = "https://codeberg.org/vitali87/croft"
homepage = "https://croft.software"

[[bin]]
name = "croft"
path = "src/main.rs"

# Versions verified against crates.io max_stable_version on 2026-05-02.
[dependencies]
# Unix process control: `setsid` to detach a probe subprocess from croft's
# controlling terminal so it can never hijack the tty (see lsp/install.rs).
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
# Embedded-shell terminal emulator. Production-grade engine from
# alacritty + zed; bounded scrollback, no allocation churn under
# heavy alt-screen TUI workloads (vt100 0.16 leaks tens of GB
# under multi-hour `claude`-style streams; this does not).
alacritty_terminal = "0.26"

# Tree-sitter core + per-language grammars.  Direct deps, no dynamic loading.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
# Trait for tree-sitter 0.26's `QueryMatches`, which is a streaming (not std)
# iterator; needed to walk outline-query matches in `outline_syntax`.
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"

ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# LSP client stack. async-lsp 0.2.4 (Apr 2026) pins lsp-types ^0.95
# because of gluon-lang/lsp-types#284, so we follow that pin. 0.95
# already covers LSP 3.17. tower is needed for ServiceBuilder layers.
# default-features = false drops the `client-monitor` default feature: it is
# a server-side helper (waitpid on the parent client) that croft never uses,
# and its `waitpid-any` dep fails to compile on android (target_os = "android"
# is not "linux", so waitpid-any has no backend module). Dropping it lets
# croft build under Termux while changing nothing on macOS/Linux.
async-lsp = { version = "0.2", default-features = false, features = ["omni-trait", "stdio", "tracing", "tokio"] }
lsp-types = "0.95"
tower = "0.5"
tui-input = "0.15"
plist = "1.9"
notify = "8.2"
notify-debouncer-full = "0.7"
base64 = "0.22"
# Integrity for the remote extension index (src/mcp/registry_index.rs): `ring`
# verifies the ed25519 signature over `index.json` against a baked public key,
# and `sha2` checks each fetched manifest against the sha256 recorded in the
# signed index. Both are already in the tree transitively (ring via ureq's TLS
# backend, sha2 via several deps), so promoting them to direct deps adds no new
# version to the lock and no new build surface — ring already compiles on every
# croft target, Termux included.
ring = "0.17"
sha2 = "0.10"
regex = "1.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# NeuQuant colour quantiser, already in the tree via image's gif feature. Used
# directly by the hand-rolled sixel encoder (src/iterm2_inline.rs) to fit an
# overlay's pixels into sixel's <=256 palette registers; avoids pulling a whole
# SIMD/proc-macro sixel crate for what are mostly two-colour codicons.
color_quant = "1.1"
# SVG rasteriser for the activity-bar codicons. Rendered once at startup at the
# exact icon pixel size, so the glyphs stay crisp at any cell size and we never
# ship (or decode) a heavyweight raster source for a 4×2-cell icon. resvg
# re-exports `usvg` and `tiny_skia`, so it is the only direct dep needed.
# default-features = false drops text/system-font/raster-image support: the
# codicons are pure `<path>` glyphs, so this trims fontdb/rustybuzz entirely.
resvg = { version = "0.47", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.4"
calamine = "0.34"
# Decompression for the `Provision::Binary` LSP backend (src/lsp/install.rs):
# release binaries ship as a single gzipped executable (taplo) or a zip with
# sibling files (clangd). Both crates are already in the tree transitively
# (flate2 via the png/gzip paths, zip via calamine), so promoting them to
# direct deps adds no new version to the lock. zip needs only `deflate` (the
# standard GitHub-release compression); its heavier default codecs are dropped.
flate2 = "1"
zip = { version = "7", default-features = false, features = ["deflate"] }
# Read-only TOML parser for the Explorer DEPENDENCIES view: extracts the
# dependency list from `pyproject.toml` (PEP 621 `[project].dependencies` or
# `[tool.poetry.dependencies]`). `parse` + `serde` give `toml::Table`/`Value`
# (the dynamic `Value` type is gated behind `serde` in toml 1.x); `display` is
# dropped since croft never writes TOML. Rust deps still come from `cargo
# metadata`, so Cargo.toml is never hand-parsed.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
similar = "3.1"
rayon = "1.12"
# Process enumeration for the DAP "Attach to Python Process" discovery
# (lists running interpreters); only the `system` feature is needed.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.2"
globset = "0.4.18"

# `trash` has no android backend: its freedesktop backend is gated
# `not(target_os = "android")`, so on android the crate fails to compile
# (no `platform` module). croft implements the freedesktop home-trash spec
# itself for android (see widgets::file_tree::move_to_trash), so the crate
# is only a dependency off-android.
[target.'cfg(not(target_os = "android"))'.dependencies]
trash = "5.2"

[dev-dependencies]
tempfile = "3.27"
pretty_assertions = "1.4"
assert_cmd = "2.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Profile used by the local cross-build fast path in `croft <host>`. Drops
# thin-LTO and bumps codegen-units back to 16 so the croft crate's codegen
# parallelises and the link step is a no-op merge instead of a full LTO
# pass; opt-level 2 keeps the resulting binary close-enough in runtime
# perf for a TUI tool while cutting incremental compile time roughly in
# half versus release.
[profile.remote-fast]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
debug = false
strip = "symbols"
