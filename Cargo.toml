[package]
name = "croft"
version = "0.1.0"
edition = "2021"
description = "Terminal-based VS Code replica: file tree, editor, embedded shell"
license = "MIT"
repository = "https://bitbucket.org/vitali_avagyan/croft"
homepage = "https://croft.sh"

[[bin]]
name = "croft"
path = "src/main.rs"

# Versions verified against crates.io max_stable_version on 2026-05-02.
[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
portable-pty = "0.9"
vt100 = "0.16"

# Tree-sitter core + per-language grammars.  Direct deps, no dynamic loading.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"

ignore = "0.4"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
futures = "0.3"
tui-input = "0.15"
plist = "1.9"
notify = "8.2"
notify-debouncer-full = "0.7"
trash = "5.2"
base64 = "0.22"
regex = "1.12"
ratatui-image = { version = "10", default-features = false, features = ["crossterm", "image-defaults"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3.27"
pretty_assertions = "1.4"
assert_cmd = "2.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
