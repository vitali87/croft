# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Reviews are restricted to high-severity findings: "quiet" is CodeRabbit's
# built-in profile for "only the most important feedback", and the
# instructions below suppress nitpick/style comments the profile alone
# might still emit.
tone_instructions: "Only flag critical, major, or high-severity issues: bugs, security vulnerabilities, data loss, blocking work before the first frame. No nitpicks, style, or minor suggestions."
reviews:
  profile: "quiet"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Only comment on critical, major, or high-severity issues: logic
        errors, security vulnerabilities, race conditions, data loss or
        corruption, breaking API changes, and any new blocking work before
        croft's first frame (croft starts in milliseconds, with no exceptions). Do NOT comment on formatting,
        naming, style, comments/docstrings, or optional refactors. If nothing
        meets the bar, leave no comments.
